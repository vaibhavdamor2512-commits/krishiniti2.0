services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: krishiniti
      MYSQL_USER: krishiniti
      MYSQL_PASSWORD: krishiniti-demo
      MYSQL_ROOT_PASSWORD: root-demo-only
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://krishiniti:krishiniti-demo@mysql:3306/krishiniti
      JWT_SECRET: ${JWT_SECRET:-replace-this-for-any-shared-environment}
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
