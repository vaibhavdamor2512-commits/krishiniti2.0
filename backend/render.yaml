services:
  - type: web
    name: krishiniti-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://krishiniti2-0.vercel.app
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000
      - key: DEMO_MODE
        value: "true"
      - key: GOOGLE_MAPS_API_KEY
        value: ""
      - key: GOOGLE_EARTH_ENGINE_PROJECT
        value: ""
      - key: WEATHER_API_KEY
        value: ""
      - key: MARKET_API_KEY
        value: ""
      - key: DISEASE_MODEL_PATH
        value: ""
      - key: DISEASE_MODEL_TYPE
        value: sklearn
      - key: DISEASE_IMAGE_MAX_MB
        value: "10"
    healthCheckPath: /health